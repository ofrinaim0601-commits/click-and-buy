<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fidget & Fun | עולם הסקווישים</title>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --neon-pink: #ff00ff; --neon-blue: #00d4ff; --bg: #0a0a0c; --card: #16161a; }
        body { font-family: 'Assistant', sans-serif; background-color: var(--bg); color: white; margin: 0; overflow-x: hidden; }
        
        header { background: linear-gradient(90deg, #ff00ff, #00d4ff); padding: 50px 20px; text-align: center; box-shadow: 0 0 20px rgba(0,212,255,0.5); }
        header h1 { margin: 0; font-size: 50px; font-weight: 800; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        header p { font-size: 20px; font-weight: 700; margin-top: 10px; }

        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; padding: 40px 10%; }

        .card { background: var(--card); border-radius: 25px; overflow: hidden; position: relative; border: 2px solid #333; transition: 0.3s; cursor: pointer; }
        .card:hover { transform: translateY(-10px); border-color: var(--neon-blue); box-shadow: 0 0 25px var(--neon-blue); }
        
        .card img { width: 100%; height: 280px; object-fit: cover; border-bottom: 2px solid #333; }
        .card-info { padding: 20px; text-align: center; }
        .card h3 { font-size: 22px; margin: 10px 0; color: #fff; }
        .price { font-size: 30px; font-weight: 800; color: var(--neon-pink); margin: 10px 0; }
        
        .buy-now { background: linear-gradient(45deg, var(--neon-pink), #ff4757); color: white; border: none; padding: 15px 35px; border-radius: 50px; font-size: 20px; font-weight: 800; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.3s; box-shadow: 0 5px 15px rgba(255, 0, 255, 0.4); }
        .buy-now:hover { transform: scale(1.1); box-shadow: 0 0 30px var(--neon-pink); }
    </style>
</head>
<body>

<header>
    <h1>Fidget & Fun ✨</h1>
    <p>אוסף הסקווישים המטורף שלנו!</p>
</header>

<div class="container">
    <div class="card">
        <img src="https://m.media-amazon.com/images/I/71Xm04I6IeL._AC_SL1500_.jpg" alt="NeeDoh Fruit">
        <div class="card-info">
            <h3>פירות לחיצים Groovy</h3>
            <p>חבילת 3 פירות לחיצים ונעימים</p>
            <div class="price">₪55</div>
            <a href="https://amzn.to/4vsDiDz" target="_blank" class="buy-now">קנה עכשיו</a>
        </div>
    </div>

    <div class="card">
        <img src="https://m.media-amazon.com/images/I/61dDzQc6xxL._AC_SL1500_.jpg" alt="Animal Squishy">
        <div class="card-info">
            <h3>סקווישי חיות ענקי</h3>
            <p>Slow Rising - חוזר לצורה לאט לאט</p>
            <div class="price">₪42</div>
            <a href="https://amzn.to/4t8yyl0" target="_blank" class="buy-now">אני רוצה כזה</a>
        </div>
    </div>

    <div class="card">
        <img src="https://m.media-amazon.com/images/I/71m67Yf29eL._AC_SL1500_.jpg" alt="Rainbow Squishy">
        <div class="card-info">
            <h3>סקווישי סמיילי צבעוני</h3>
            <p>הכי ויראלי בטיקטוק - רך בטירוף</p>
            <div class="price">₪38</div>
            <a href="https://amzn.to/4tPsM7K" target="_blank" class="buy-now">למבצע באמזון</a>
        </div>
    </div>
</div>

</body>
</html>
